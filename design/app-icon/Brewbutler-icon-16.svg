  <ellipse cx="500" cy="788" rx="242" ry="30" fill="#3A1703" opacity="0.20" filter="url(#blur14)"/>
  <circle cx="636" cy="572" r="94" fill="none" stroke="url(#cream)" stroke-width="56"/>
