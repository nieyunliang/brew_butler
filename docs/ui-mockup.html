<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brewbutler 2.0 · Liquid Glass 原型</title>
<!--
  Brewbutler UI v2.0.2 原型（docs/ui-design.md），已与 UX 方案 v1.4（docs/ux-optimization-plan.md）同步。
  浏览器无法还原 Liquid Glass 的真实折射，这里用 backdrop-filter + 高光描边表达层级与形状。
  所有包版本、CVE、服务记录均为演示数据，不是事实基线（见 technical-notes §1）。
  查询参数：?screen=overview|updates|library|discover|services|maintenance|detail|settings
           &theme=dark &reduce=1 &palette=1 &select=1 &w=1024 &dock=0
           &island=open|result|summary|sync   任务岛：展开 / 批次结果态 / 结果汇总 / 正在同步索引
           &sheet=uninstall|reinstall &target=openssl@3 &zap=1
           &lf=pin,manual,keg,tap:homebrew/core &menu=1   资料库附加筛选 / 打开「筛选」菜单
           &uscope=安全 &sync=fail &dtab=依赖 &settab=homebrew &onboard=1|2|3
-->
<style>
:root{
  --accent:#0A84FF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
  --canvas:#F5F5F7; --raised:#FFFFFF; --sep:rgba(0,0,0,.09);
  --t1:#1D1D1F; --t2:rgba(29,29,31,.68); --t3:rgba(29,29,31,.46);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.74);
  --glass-edge:rgba(255,255,255,.75); --glass-shadow:0 10px 30px -8px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.06);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(0,0,0,.05);
  --solid:#ECECEE;
  --green:#28A745; --orange:#F08A00; --red:#E5372E; --yellow:#E8B500; --blue:#0A84FF; --gray:#8E8E93;
  --console:#FFFFFF;
}
.dark{
  --canvas:#1C1C1E; --raised:#262628; --sep:rgba(255,255,255,.10);
  --t1:#F5F5F7; --t2:rgba(245,245,247,.70); --t3:rgba(245,245,247,.45);
  --glass:rgba(48,48,52,.52); --glass-strong:rgba(56,56,60,.72);
  --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 12px 34px -8px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.4);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.25);
  --solid:#2C2C2E;
  --green:#32D74B; --orange:#FF9F0A; --red:#FF453A; --yellow:#FFD60A; --blue:#0A84FF; --gray:#98989D;
  --console:#151517;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.45 var(--font);color:var(--t1);overflow:hidden;
  background:
    radial-gradient(1200px 700px at 12% 18%, #7FB7FF 0%, transparent 60%),
    radial-gradient(900px 700px at 88% 22%, #FFB38A 0%, transparent 60%),
    radial-gradient(1000px 800px at 60% 100%, #B79BFF 0%, transparent 60%),
    linear-gradient(135deg,#DCE8F7,#F3E3EE);
  -webkit-font-smoothing:antialiased}
body.dark{background:
    radial-gradient(1200px 700px at 12% 18%, #1E3E78 0%, transparent 60%),
    radial-gradient(900px 700px at 88% 22%, #6B2E3A 0%, transparent 60%),
    radial-gradient(1000px 800px at 60% 100%, #3A2A6E 0%, transparent 60%),
    linear-gradient(135deg,#0F1626,#1D1324)}
button{white-space:nowrap;font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.t2{color:var(--t2)} .t3{color:var(--t3)}

/* ---------- 玻璃 ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  border:1px solid var(--glass-edge);box-shadow:var(--glass-hi),var(--glass-shadow)}
.glass.strong{background:var(--glass-strong)}
.reduce .glass{background:var(--solid)!important;-webkit-backdrop-filter:none;backdrop-filter:none;border-color:var(--sep);box-shadow:0 6px 18px -8px rgba(0,0,0,.25)}
.reduce .hero-ext{display:none}

/* ---------- 演示控制坞 ---------- */
.dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px;border-radius:999px;z-index:100;font-size:12px}
.dock button{padding:5px 11px;border-radius:999px}
.dock button.on{background:var(--accent);color:#fff}
.dock .sw{width:16px;height:16px;border-radius:50%;padding:0;border:2px solid transparent}
.dock .sw.on{border-color:var(--t1)}
.dock .lbl{padding:0 6px;color:var(--t2)}

/* ---------- 窗口 ---------- */
.stage{position:absolute;inset:0;display:grid;place-items:center;padding:24px 24px 64px}
.window{position:relative;width:1280px;height:820px;border-radius:26px;overflow:hidden;background:var(--canvas);
  box-shadow:0 50px 120px -30px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.12);transform-origin:center}
.dark .window{box-shadow:0 50px 120px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.1)}
.window.narrow{width:1024px;height:768px}
.hero-ext{position:absolute;left:0;right:0;top:0;height:250px;pointer-events:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 22%,transparent),transparent 92%)}

/* 侧边栏：浮动玻璃 */
.sidebar{position:absolute;left:9px;top:9px;bottom:9px;width:220px;border-radius:20px;padding:46px 10px 10px;display:flex;flex-direction:column;z-index:20}
.lights{position:absolute;left:17px;top:18px;display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;background:#FF5F57}
.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:10px;text-align:left;font-size:13px}
.nav button:hover{background:rgba(127,127,127,.12)}
.nav button.on{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.nav button.on .ico{color:var(--accent)}
.nav .ico{width:18px;text-align:center;font-size:14px;color:var(--t2)}
.nav .badge{margin-left:auto;font-size:11px;color:var(--t2);font-variant-numeric:tabular-nums}
.nav .badge.red{background:var(--red);color:#fff;border-radius:999px;padding:0 6px;font-weight:600}
.side-h{font-size:11px;color:var(--t3);font-weight:600;padding:12px 10px 4px}
.brewcard{margin-top:auto;border-radius:14px;padding:10px 12px;font-size:11.5px;background:rgba(127,127,127,.10)}
.brewcard b{font-size:12px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:1px}

/* 工具栏 */
.toolbar{position:absolute;left:240px;right:12px;top:10px;height:40px;display:flex;align-items:center;gap:10px;z-index:15}
.tgroup{display:flex;align-items:center;height:36px;border-radius:999px;padding:0 4px}
.tgroup button{height:30px;min-width:30px;padding:0 9px;border-radius:999px;display:flex;align-items:center;gap:6px;font-size:13px}
.tgroup button:hover{background:rgba(127,127,127,.14)}
.ttitle{font-size:15px;font-weight:600;margin-left:6px;white-space:nowrap}
.search{flex:0 1 300px;margin-left:auto;display:flex;align-items:center;gap:7px;padding:0 12px;height:36px;border-radius:999px;color:var(--t2);position:relative}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--t1)}
.kbd{font-size:11px;color:var(--t3);border:1px solid var(--sep);border-radius:5px;padding:0 4px}
.suggest{position:absolute;top:42px;left:0;right:0;border-radius:18px;padding:6px;display:none;z-index:40}
.suggest.show{display:block}
.suggest div{padding:7px 10px;border-radius:10px;color:var(--t1)}
.suggest div:first-child{background:color-mix(in srgb,var(--accent) 18%,transparent)}

/* 内容 */
.content{position:absolute;left:238px;right:0;top:0;bottom:0;overflow:auto;padding:64px 28px 120px 20px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.window.has-inspector .content{right:316px}
.window.has-inspector .toolbar{right:328px}
.hero{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.hero h1{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.hero .sub{color:var(--t2);font-size:13px;margin-top:2px}
.hero .acts{margin-left:auto;display:flex;gap:8px}
.btn{height:30px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.g{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:var(--glass-hi),0 2px 8px -2px rgba(0,0,0,.12)}
.btn.p{background:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px -4px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.danger{background:color-mix(in srgb,var(--red) 16%,var(--glass));color:var(--red);border:1px solid color-mix(in srgb,var(--red) 30%,transparent)}
.btn.sm{height:24px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.reduce .btn.g{background:var(--solid);backdrop-filter:none;-webkit-backdrop-filter:none}

.card{background:var(--raised);border-radius:18px;padding:16px;box-shadow:0 0 0 1px var(--sep)}
.card h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h3 .r{margin-left:auto;font-size:12px;font-weight:400;color:var(--t2);display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.narrow .grid2{grid-template-columns:1fr}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.metric{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer}
.metric:hover{box-shadow:0 0 0 1px var(--sep),0 6px 18px -10px rgba(0,0,0,.3)}
.ring{width:52px;height:52px;flex:none}
.metric .v{font:600 24px/1.1 ui-rounded,var(--font);font-variant-numeric:tabular-nums}
.metric .l{font-size:12px;color:var(--t2)}

.badge{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap;vertical-align:1px}
.b-red{background:color-mix(in srgb,var(--red) 15%,transparent)} .b-red i{color:var(--red)}
.b-orange{background:color-mix(in srgb,var(--orange) 15%,transparent)} .b-orange i{color:var(--orange)}
.b-yellow{background:color-mix(in srgb,var(--yellow) 22%,transparent)} .b-yellow i{color:#B88A00}
.dark .b-yellow i{color:var(--yellow)}
.b-gray{background:color-mix(in srgb,var(--gray) 18%,transparent)} .b-gray i{color:var(--gray)}
.b-green{background:color-mix(in srgb,var(--green) 15%,transparent)} .b-green i{color:var(--green)}
.b-blue{background:color-mix(in srgb,var(--blue) 14%,transparent)} .b-blue i{color:var(--blue)}
.b-accent{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.badge i{font-style:normal;font-size:10px}

/* scope 栏 */
.scope{display:inline-flex;gap:2px;padding:3px;border-radius:999px;margin-bottom:12px;position:relative}
.scope button{height:28px;padding:0 13px;border-radius:999px;font-size:12.5px;display:flex;gap:6px;align-items:center;position:relative;z-index:1}
.scope button .c{color:var(--t3);font-variant-numeric:tabular-nums}
.scope button.on{color:#fff}
.scope button.on .c{color:rgba(255,255,255,.8)}
.scope .pill{position:absolute;top:3px;height:28px;border-radius:999px;background:var(--accent);transition:all .35s cubic-bezier(.3,1.3,.5,1);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.motion-off .scope .pill{transition:none}
.scopeRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scopeRow .r{margin-left:auto;margin-bottom:12px;color:var(--t2);font-size:12px}

/* 列表 */
.list{background:var(--raised);border-radius:18px;box-shadow:0 0 0 1px var(--sep);overflow:hidden;margin-bottom:14px}
.ghead{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:12px;font-weight:600;color:var(--t2);background:color-mix(in srgb,var(--t1) 3%,transparent);border-bottom:1px solid var(--sep)}
.ghead .r{margin-left:auto;font-weight:400;display:flex;gap:8px;align-items:center}
.row{display:grid;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--sep);cursor:default}
.row:last-child{border-bottom:0}
.row:hover{background:color-mix(in srgb,var(--t1) 3.5%,transparent)}
.row.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.row .nm{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .ds{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-row{grid-template-columns:20px minmax(0,1fr) 170px 120px}
.l-row{grid-template-columns:20px minmax(0,1.6fr) 74px 90px 90px 76px 70px}
.narrow .l-row{grid-template-columns:20px minmax(0,1.6fr) 74px 90px 90px}
.narrow .l-row .hide-n{display:none}
.l-head{font-size:11.5px;font-weight:600;color:var(--t3);padding:8px 16px;border-bottom:1px solid var(--sep)}
.cb{width:16px;height:16px;border-radius:5px;border:1.5px solid color-mix(in srgb,var(--t1) 30%,transparent);display:grid;place-items:center;cursor:pointer;font-size:11px;color:#fff}
.cb.on{background:var(--accent);border-color:var(--accent)}
.cb.dis{opacity:.35;cursor:not-allowed}
.st{width:16px;height:16px;display:grid;place-items:center;font-size:13px}
.ver{font-family:var(--mono);font-size:12px;white-space:nowrap}
.ver b{color:var(--accent);font-weight:700}
.ver .old{color:var(--t3)}
.spin{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.motion-off .spin{animation:none}
.indet{height:4px;border-radius:4px;background:color-mix(in srgb,var(--accent) 18%,transparent);overflow:hidden;position:relative;width:120px;margin-top:4px}
.indet::after{content:"";position:absolute;inset:0;width:40%;background:var(--accent);border-radius:4px;animation:ind 1.4s ease-in-out infinite}
@keyframes ind{0%{left:-40%}100%{left:100%}}
.motion-off .indet::after{animation:none;left:30%}
.err{grid-column:2/-1;font-size:12px;color:var(--red);font-family:var(--mono);margin-top:-2px}

/* 浮动栏 & 任务岛 */
.floatzone{position:absolute;left:238px;right:0;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:30;pointer-events:none}
.window.has-inspector .floatzone{right:316px}
.floatzone>*{pointer-events:auto}
.fbar{display:flex;align-items:center;gap:8px;height:46px;padding:0 8px 0 16px;border-radius:999px;animation:pop .35s cubic-bezier(.3,1.3,.5,1)}
@keyframes pop{from{transform:translateY(16px) scale(.92);opacity:0}}
.motion-off .fbar,.motion-off .island{animation:none!important}
.islandRow{display:flex;align-items:center;gap:8px}
.island{display:flex;align-items:center;gap:10px;height:46px;padding:0 8px 0 14px;border-radius:999px;cursor:pointer;min-width:360px;transition:all .4s cubic-bezier(.3,1.2,.5,1)}
.island .ttl{font-weight:600}
.island .ib{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.island .ib:hover{background:rgba(127,127,127,.15)}
.toast{height:36px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:7px;font-size:12.5px;animation:pop .35s cubic-bezier(.3,1.3,.5,1)}
.panel{width:min(760px,calc(100% - 56px));height:380px;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;animation:grow .42s cubic-bezier(.3,1.15,.5,1)}
@keyframes grow{from{transform:scale(.6,.15) translateY(140px);opacity:.3;border-radius:999px}}
.motion-off .panel{animation:none}
.panel .ph{display:flex;align-items:center;gap:10px;padding:14px 14px 8px 18px}
.panel .ph .ttl{font-size:15px;font-weight:600}
.prog{height:6px;border-radius:6px;background:color-mix(in srgb,var(--t1) 10%,transparent);margin:0 18px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:6px}
.panel .tabs{margin:10px 18px 6px}
.panel .pb{flex:1;overflow:auto;margin:0 10px 10px;border-radius:16px}
.prow{display:grid;grid-template-columns:20px 110px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px}
.prow:hover{background:rgba(127,127,127,.1)}
.console{background:var(--console);height:100%;border-radius:14px;padding:12px 14px;font:12px/1.65 var(--mono);color:var(--t1);overflow:auto;box-shadow:0 0 0 1px var(--sep)}
.console .m{color:var(--t3)} .console .ok{color:var(--green)} .console .e{color:var(--red)} .console .h{color:var(--accent);font-weight:600}

/* 检查器 */
.inspector{position:absolute;right:9px;top:9px;bottom:9px;width:300px;border-radius:20px;padding:56px 0 12px;overflow:auto;z-index:18;scrollbar-width:none}
.isec{padding:4px 16px 12px}
.isec h4{font-size:11px;font-weight:600;color:var(--t3);margin:6px 0 6px}
.igroup{background:rgba(127,127,127,.09);border-radius:12px;padding:2px 12px}
.reduce .igroup{background:var(--raised)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--sep);font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--t2)}
.ibtn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 0;border-bottom:1px solid var(--sep);font-size:12.5px;text-align:left}
.ibtn:last-child{border-bottom:0}
.ibtn.red{color:var(--red)}

/* 详情 */
.dhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.dicon{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;font-size:26px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px -6px var(--accent)}
.dhead h1{font-size:22px;font-weight:600}
.notice{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:16px;margin-bottom:14px}
.notice.red{background:color-mix(in srgb,var(--red) 10%,var(--glass))}
.notice.blue{background:color-mix(in srgb,var(--blue) 10%,var(--glass))}
.notice.orange{background:color-mix(in srgb,var(--orange) 12%,var(--glass))}
.notice .r{margin-left:auto}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.meta .kv{font-size:13px}
.codebox{font:12px/1.6 var(--mono);background:color-mix(in srgb,var(--t1) 5%,transparent);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:8px}

/* 严重度条 */
.sevbar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin:6px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:color-mix(in srgb,var(--t1) 6%,transparent);font-size:12px;cursor:pointer}
.chip:hover{background:color-mix(in srgb,var(--t1) 10%,transparent)}
details.why{font-size:12px;color:var(--t2)}
details.why summary{cursor:pointer;color:var(--accent)}
.miniRow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--sep);font-size:12.5px}
.miniRow:last-child{border-bottom:0}
.miniRow .r{margin-left:auto;color:var(--t3);font-size:12px}

/* 服务 */
.s-row{grid-template-columns:96px minmax(0,1fr) auto}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500}

/* 遮罩 / 弹层 / 面板 */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.14);z-index:50;display:grid;place-items:start center}
.dark .scrim{background:rgba(0,0,0,.35)}
.palette{margin-top:120px;width:640px;border-radius:24px;overflow:hidden;animation:pop .3s cubic-bezier(.3,1.2,.5,1)}
.palette .pi{display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;font-size:16px;border-bottom:1px solid var(--sep)}
.palette .pi input{flex:1;border:0;background:none;outline:none;font-size:16px}
.pgroup{padding:6px 8px}

.toggle.on{background:var(--green)}
.toggle.on::after{left:16px}
.field{width:100%;height:32px;border-radius:10px;border:1px solid var(--sep);background:var(--raised);padding:0 10px;font-family:var(--mono);outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}

.seg span.on{background:var(--raised);box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* 资料库「筛选」菜单与 token 行（UX O-06） */

.chk.on{background:var(--accent);border-color:var(--accent)}

.empty{text-align:center;padding:40px 0;color:var(--t2)}
.hidden{display:none!important}
</style>
</head>

<script>

const LIB = [
  ['aom','formula','3.12.1','3.12.2','10.4 MB','3月14日','','homebrew/core'],

  setTab: q.get('settab')||'通用', onboard: +(q.get('onboard')||0), onbScan:false,

if (S.screen==='settings'){ S.settings=true; S.screen='overview'; }

/* ============ 工具 ============ */
const $ = s => document.querySelector(s);
const sev = s => { const [l,c,i]=SEVMAP[s]; return `<span class="badge ${c}"><i>${i}</i>${l}</span>`; };
const bdg = (t,c,i='') => `<span class="badge ${c}">${i?`<i>${i}</i>`:''}${t}</span>`;
const ring = (pct,color) => { const r=22,c=2*Math.PI*r; return `<svg class="ring" viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="color-mix(in srgb,${color} 18%,transparent)" stroke-width="6"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*pct} ${c}" transform="rotate(-90 26 26)"/></svg>`; };
const scope = (items, cur, key) => `<div class="scope glass" data-scope="${key}">${items.map(([t,c])=>`<button class="${t===cur?'on':''}" data-v="${t}">${t}${c!==undefined?` <span class="c">${c}</span>`:''}</button>`).join('')}<span class="pill"></span></div>`;
function placePills(){ document.querySelectorAll('.scope').forEach(sc=>{ const on=sc.querySelector('button.on'), p=sc.querySelector('.pill'); if(on&&p){p.style.left=on.offsetLeft+'px';p.style.width=on.offsetWidth+'px';} }); }

/* ============ 页面 ============ */

const syncFailNotice = () => S.syncFail ? `<div class="notice orange glass"><span style="color:var(--orange)">▲</span>未能同步上游，结果基于 2 小时前的本地索引。<button class="btn g sm r" data-check>重试</button></div>` : '';

function uRow(p, secRow){
  const st = p.state;
  let lead;
  if(st==='running') lead=`<span class="st"><span class="spin"></span></span>`;

  else if(st==='failed') lead=`<span class="st" style="color:var(--red)">✕</span>`;
  else if(st==='queued') lead=`<span class="st t3">◷</span>`;
  else lead=`<span class="cb ${S.sel.has(p.n)?'on':''} ${p.pinned||(!p.fix&&secRow)?'dis':''}" data-sel="${p.n}" title="${p.pinned?'已锁定的包不会被更新，可在详情中解锁':''}">${S.sel.has(p.n)?'✓':''}</span>`;
  const badges = (p.pinned?bdg('已锁定','b-gray','⌖'):'') + (p.cask?bdg('cask','b-blue'):'');
  const mid = secRow

  const ver = p.to ? `<span class="ver"><span class="old">${p.from}</span> → <b>${p.to}</b></span>` : `<span class="ver old">${p.from}</span>`;

function libMatch([n,k,v,l,sz,at,f,tap]){
  const fl=f.split(' ');
  if(S.lScope==='formula'&&k!=='formula')return false;
  if(S.lScope==='cask'&&k!=='cask')return false;
  if(S.lScope==='可更新'&&!l)return false;
  if(S.lScope==='有已知漏洞'&&!f.includes('vuln'))return false;
  for(const x of S.lf){ if(x.startsWith('tap:')){ if(tap!==x.slice(4))return false; } else if(!fl.includes(x))return false; }
  return true;
}

}

// UX O-11：首启引导 3 步；检测成功后索引已在后台开始
function onboarding(){
  const st=S.onboard, dots=`<span class="dots">${[1,2,3].map(i=>`<i class="${i===st?'on':''}"></i>`).join('')}</span>`;
  const step = st===1 ? `
    <h2>检测 Homebrew</h2><div class="lead">Brewbutler 帮你看清本机 Homebrew 装了什么、能否安全更新。</div>
    <div class="cand on"><span class="radio"></span><div style="flex:1"><b class="mono">/opt/homebrew/bin/brew</b><div class="t2" style="font-size:12px">Homebrew 7.0.10 · Apple 芯片默认位置</div></div>${bdg('可用','b-green','✓')}</div>
    <div class="cand"><span class="radio"></span><div style="flex:1"><b class="mono">/usr/local/bin/brew</b><div class="t2" style="font-size:12px">Homebrew 4.6.2 · Intel 旧位置</div></div>${bdg('可用','b-green','✓')}</div>
    <div class="t2" style="font-size:12px;display:flex;align-items:center;gap:8px;margin-top:10px"><span class="spin"></span>正在后台载入已安装的包（59 个）…你可以继续下一步。</div>
    <div style="margin-top:8px"><a class="linkbtn">手动指定路径…</a></div>`
  : st===2 ? `
    <h2>隐私与安全</h2><div class="lead">在开始之前，你需要知道这三件事。</div>
    <div class="pr"><span style="color:var(--accent);font-size:18px">⛨</span><div><b>不需要账号，不上传任何东西</b><div class="t2">包列表、命令输出和环境信息都只留在这台 Mac 上。</div></div></div>
    <div class="pr"><span style="color:var(--orange);font-size:18px">▲</span><div><b>危险操作一定会先问你</b><div class="t2">卸载、清理、重新安装、服务启停都需要二次确认，默认焦点在「取消」。</div></div></div>
    <div class="pr"><span style="color:var(--green);font-size:18px">🔑</span><div><b>永远不会索要管理员密码</b><div class="t2">需要管理员权限的操作会给出终端命令，由你自己执行。</div></div></div>`
  : `
    <h2>准备好了</h2><div class="lead">已安装的 59 个包已经载入。两个快捷键就够你开始：</div>
    <div class="pr"><span class="kbd" style="font-size:13px;padding:2px 8px">⌘K</span><div><b>命令面板</b><div class="t2">跳转页面、找包、执行操作。</div></div></div>
    <div class="pr"><span class="kbd" style="font-size:13px;padding:2px 8px">⌘R</span><div><b>检查更新</b><div class="t2">先同步 Homebrew 索引，再检查哪些包可以更新。</div></div></div>
    <label style="display:flex;gap:10px;align-items:center;margin-top:14px;cursor:pointer" data-onbscan><span class="chk ${S.onbScan?'on':''}">${S.onbScan?'✓':''}</span>现在运行一次安全扫描（约 30 秒）</label>`;
  return `<div class="onb glass strong" role="dialog" aria-label="首次启动引导，第 ${st} 步，共 3 步">${step}
    <div class="foot">${dots}<button class="btn" data-onbskip>跳过</button>${st>1?'<button class="btn g" data-onbprev>上一步</button>':''}<button class="btn p" data-onbnext>${st===3?'开始使用':'下一步'}</button></div></div>`;
}

/* ============ 任务岛 / 浮动栏 / toast ============ */
function floatzone(){
  let h='';
  const selN = S.screen==='updates'?S.sel.size:S.screen==='library'?S.libSel.size:0;
  if(selN && !islOpen()){
    h+= S.screen==='updates'
      ? `<div class="fbar glass"><b class="num">已选 ${selN} 项</b><button class="btn p sm">更新所选</button><button class="btn g sm">预览</button><button class="btn sm" data-clear>取消选择</button></div>`
      : `<div class="fbar glass"><b class="num">已选 ${selN} 项</b><button class="btn p sm">更新</button><button class="btn g sm">锁定</button><button class="btn g sm" data-sheet="uninstall">卸载…</button><button class="btn sm" data-clear>取消选择</button></div>`;
  }
  if(islOpen()){
    const showRows = S.screen!=='updates';
    const done = S.isl==='summary';
    const body = S.iTab==='汇总' ? `
        <div class="sumgrid"><div><b style="color:var(--green)">5</b><span class="t2">成功</span></div><div><b style="color:var(--red)">1</b><span class="t2">失败</span></div><div><b>0</b><span class="t2">未验证</span></div><div><b>0</b><span class="t2">已取消</span></div></div>
        <div class="prow"><span style="color:var(--red)">✕</span><b>aom</b><span style="color:var(--red)" class="mono">退出码 1 · Error: Failed to download resource "aom--3.12.2"</span><span style="display:flex;gap:6px"><button class="btn g sm" data-itab="日志">查看日志</button><button class="btn g sm">重试…</button></span></div>
        <div class="prow"><span style="color:var(--green)">✓</span><b>librsvg 等 5 个</b><span class="t2">ffmpeg · librsvg · jq · wget · sqlite</span><span></span></div>
        <div class="notice orange" style="margin:10px 8px 0;padding:8px 12px"><span style="color:var(--orange)">▲</span><span>已安装的包有变化，扫描结果可能已过时。</span><button class="btn g sm r">重新扫描</button></div>`
      : S.iTab==='日志' ? `<div class="console" role="log">
<div class="m">$ brew upgrade ffmpeg</div><div class="h">==&gt; Upgrading 1 outdated package:</div><div>ffmpeg 7.1 -&gt; 7.1.1</div><div class="h">==&gt; Fetching ffmpeg</div><div>==&gt; Downloading https://ghcr.io/v2/homebrew/core/ffmpeg/blobs/sha256:4c1e…</div><div class="m">############################################ 61.4%</div></div>`
      : S.iTab==='队列' ? ['jq','wget','sqlite'].map((n,i)=>`<div class="prow"><span class="t3">${i+1}</span><b>更新 ${n}</b><span class="t2 mono">brew upgrade ${n}</span><button class="btn sm">移除</button></div>`).join('')
      : S.iTab==='历史' ? `<div class="prow"><span style="color:var(--green)">✓</span><b>更新 librsvg</b><span class="t2">2 分钟前 · 14s · 退出码 0</span><button class="btn g sm">日志</button></div><div class="prow"><span style="color:var(--red)">✕</span><b>更新 aom</b><span class="t2">3 分钟前 · 退出码 1</span><button class="btn g sm">重试…</button></div><div class="prow"><span style="color:var(--green)">✓</span><b>安全扫描</b><span class="t2">18 分钟前 · 31.4s · 退出码 1（发现漏洞，属预期）</span><button class="btn g sm">日志</button></div>`
      : showRows ? `<div class="prow"><span style="color:var(--green)">✓</span><b>librsvg</b><span class="t2">完成 · 14s</span><span></span></div>
        <div class="prow"><span style="color:var(--red)">✕</span><b>aom</b><span style="color:var(--red)" class="mono">退出码 1 · Failed to download resource</span><span style="display:flex;gap:6px"><button class="btn g sm">复制</button><button class="btn g sm">重试…</button></span></div>
        <div class="prow"><span class="spin"></span><b>ffmpeg</b><span class="t2">正在下载… <span class="indet" style="display:inline-block;vertical-align:middle;margin:0 0 0 6px"></span></span><span></span></div>
        <div class="prow"><span class="t3">◷</span><b>jq</b><span class="t2">排队中</span><span></span></div>
        <div class="prow"><span class="t3">◷</span><b>wget</b><span class="t2">排队中</span><span></span></div>`
      : `<div class="empty">逐包进度已显示在更新列表中。</div>`;
    h+=`<div class="panel glass strong" role="region" aria-label="任务岛">
      ${done
        ? `<div class="ph"><span style="color:var(--red);font-size:15px">✕</span><span class="ttl">更新 6 个包 · 已结束</span><span class="t2 num">5 个成功 · 1 个失败 · 用时 03:12</span>
        <span style="margin-left:auto;display:flex;gap:6px"><button class="btn sm" data-island title="收起 ⌥⌘L">⌄</button></span></div>
      <div class="prog"><i style="width:100%;background:linear-gradient(90deg,var(--green) 83%,var(--red) 83%)"></i></div>`
        : `<div class="ph"><span class="spin"></span><span class="ttl">更新 6 个包</span><span class="t2 num">2/6 已完成 · 已用 01:24</span>
        <span style="margin-left:auto;display:flex;gap:6px"><button class="btn g sm">⏸ 暂停</button><button class="btn g sm">取消</button><button class="btn sm" data-island title="收起 ⌥⌘L">⌄</button></span></div>
      <div class="prog"><i style="width:33%"></i></div>`}
      <div class="tabs">${scope(done?[['汇总'],['日志'],['历史']]:[['进度'],['日志'],['队列',3],['历史']],S.iTab,'it').replace('margin-bottom:12px','')}</div>
      <div class="pb">${body}</div></div>`;
  } else if(S.isl==='result'){
    // 批次结果态：有失败 → 常驻，直到用户点开；全部成功时 5 秒后淡出（这里演示有失败的情况）
    h+=`<div class="islandRow"><div class="island glass res fail" data-island role="button" aria-label="批次结果：6 个包已处理，1 个失败。点击查看汇总">
        <span style="color:var(--red);font-size:15px">✕</span><span class="ttl">6 个包已处理 · <span style="color:var(--red)">1 个失败</span></span><span class="t2">›</span></div></div>`;
  } else if(S.isl==='sync'){
    h+=`<div class="islandRow"><div class="island glass" data-island role="button" aria-label="任务岛：正在同步 Homebrew 索引，完成后检查可更新项">
        <span class="spin"></span><span class="ttl">正在同步 Homebrew 索引…</span><span class="t2">完成后检查可更新项 · 已用 00:06</span>
        <span style="margin-left:auto;display:flex"><span class="ib" title="取消（仍会用本地索引完成检查）">✕</span><span class="ib" title="展开 ⌥⌘L">⌃</span></span></div></div>`;
  } else {
    h+=`<div class="islandRow">${S.toast?`<div class="toast glass" data-toast><span style="color:var(--green)">✓</span>librsvg 已更新到 2.63.4</div>`:''}
      <div class="island glass" data-island role="button" aria-label="任务岛：正在更新 ffmpeg，2/6 已完成。点击展开">
        <span class="spin"></span><span class="ttl">更新 ffmpeg</span><span class="t2 num">2/6 · 已用 01:24</span>
        <span style="margin-left:auto;display:flex"><span class="ib" title="暂停">⏸</span><span class="ib" title="取消">✕</span><span class="ib" title="展开 ⌥⌘L">⌃</span></span></div></div>`;
  }
  return h;
}

/* ============ 渲染 ============ */
function render(){
  document.body.className = (S.theme==='dark'?'dark ':'') + (S.reduce?'reduce ':'') + (S.motion?'':'motion-off');
  document.documentElement.style.setProperty('--accent', S.accent);
  const win=$('#win'); win.classList.toggle('narrow',S.narrow); win.classList.toggle('has-inspector',S.screen==='detail');
  const active = S.screen==='detail'?S.prev:S.screen;
  $('#nav').innerHTML = NAV.map(([k,t,i,b])=>`<button class="${k===active&&S.screen!=='discover'?'on':''}" data-go="${k}"><span class="ico">${i}</span>${t}<span class="badge ${k==='updates'?'red':''}">${b}</span></button>`).join('');
  const title = {overview:'概览',updates:'更新',library:'资料库',services:'服务',maintenance:'维护',discover:'发现',detail:'openssl@3'}[S.screen];
  $('#toolbar').innerHTML = `
    <div class="tgroup glass"><button title="返回 ⌘[" data-back>‹</button><button title="前进">›</button></div>
    <span class="ttitle">${title}</span>
    <div class="search glass" id="searchBox">🔍<input id="search" placeholder="搜索包或命令" value="${S.query}"><span class="kbd">⌘F</span>
      <div class="suggest glass strong" id="suggest"></div></div>
    <div class="tgroup glass"><button title="检查更新 ⌘R（先同步 Homebrew 索引）" data-check>↻</button><button title="安全扫描 ⇧⌘V">⛨</button><button title="命令面板 ⌘K" data-pal>⌘K</button></div>
    ${S.screen==='detail'?'<div class="tgroup glass"><button title="检查器">◧</button></div>':''}`;
  const pages={overview,updates,library,discover,services,maintenance,detail};
  $('#content').innerHTML = pages[S.screen]();
  const ins=$('#inspector'); ins.classList.toggle('hidden',S.screen!=='detail'); if(S.screen==='detail') ins.innerHTML=inspector();
  $('#floatzone').innerHTML = floatzone();
  let ov='';
  if(S.onboard) ov=`<div class="scrim">${onboarding()}</div>`;
  else if(S.palette) ov=`<div class="scrim" data-scrim>${palette()}</div>`;
  else if(S.sheet==='uninstall') ov=`<div class="scrim" data-scrim>${uninstallSheet()}</div>`;
  else if(S.sheet==='reinstall') ov=`<div class="scrim" data-scrim>${reinstallSheet()}</div>`;
  else if(S.settings) ov=`<div class="scrim" data-scrim>${settingsWin()}</div>`;
  $('#overlay').innerHTML=ov;
  $('#syncAge').textContent='上游同步于 '+(S.syncFail?'2 小时前':'8 分钟前');
  $('#dock').classList.toggle('hidden',!S.dock); renderDock(); placePills(); fit();
  const zi=$('#zapInput'); if(zi){zi.focus();zi.setSelectionRange(zi.value.length,zi.value.length);}
  const pi=$('#palInput'); if(pi){pi.focus();pi.setSelectionRange(pi.value.length,pi.value.length);}
}
function renderDock(){
  const acc=['#0A84FF','#BF5AF2','#FF375F','#FF9F0A','#30D158','#8E8E93'];
  $('#dock').innerHTML = `<span class="lbl">演示</span>
    <button class="${S.theme==='light'?'on':''}" data-theme="light">浅色</button><button class="${S.theme==='dark'?'on':''}" data-theme="dark">深色</button>
    <button class="${S.reduce?'on':''}" data-reduce>降低透明度</button><button class="${S.motion?'':'on'}" data-motion>减少动效</button>
    <button class="${S.narrow?'on':''}" data-narrow>1024</button>
    <span class="lbl">系统强调色</span>${acc.map(c=>`<button class="sw ${S.accent===c?'on':''}" style="background:${c}" data-accent="${c}" aria-label="强调色 ${c}"></button>`).join('')}
    <button data-pal>⌘K</button><button data-sheet="uninstall">卸载确认</button><button data-settings>⌘, 设置</button>
    <button class="${S.isl==='result'||S.isl==='summary'?'on':''}" data-demoresult>批次结果</button><button data-onboard>首启引导</button>`;
}
function fit(){
  const w=$('#win'), W=S.narrow?1024:1280, H=S.narrow?768:820;
  const s=Math.min(1,(innerWidth-48)/W,(innerHeight-88)/H); w.style.transform=`scale(${s})`;
}

/* ============ 交互 ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-detail],[data-sel],[data-lsel],[data-island],[data-back],[data-clear],[data-pal],[data-sheet],[data-close],[data-zap],[data-theme],[data-reduce],[data-motion],[data-accent],[data-narrow],[data-settings],[data-scrim],[data-pgo],[data-dtab],[data-toast],[data-fmenu],[data-lf],[data-lfx],[data-lfclear],[data-check],[data-itab],[data-searchdep],[data-settab],[data-onboard],[data-onbnext],[data-onbprev],[data-onbskip],[data-onbscan],[data-demoresult],.scope button');
  if(!t){ if(S.fmenu&&!e.target.closest('.fmenu')){S.fmenu=false;render();} return; }
  const d=t.dataset;
  if(t.matches('.scope button')){ const k=t.parentElement.dataset.scope, v=t.dataset.v;
    if(k==='u')S.uScope=v; else if(k==='l')S.lScope=v; else if(k==='dt')S.dTab=v; else if(k==='it')S.iTab=v; render(); return; }
  if(d.sel!==undefined){ e.stopPropagation(); if(t.classList.contains('dis'))return; S.sel.has(d.sel)?S.sel.delete(d.sel):S.sel.add(d.sel); render(); return; }
  if(d.lsel!==undefined){ e.stopPropagation(); S.libSel.has(d.lsel)?S.libSel.delete(d.lsel):S.libSel.add(d.lsel); render(); return; }
  // 资料库「筛选」菜单：已锁定 / 手动安装 / keg-only 可多选；tap 单选；均与 scope 取交集
  if(d.fmenu!==undefined){ S.fmenu=!S.fmenu; render(); return; }
  if(d.lf!==undefined){ const v=d.lf;
    if(v.startsWith('tap:')){ [...S.lf].filter(x=>x.startsWith('tap:')).forEach(x=>S.lf.delete(x)); if(v!=='tap:')S.lf.add(v); S.fmenu=false; }
    else S.lf.has(v)?S.lf.delete(v):S.lf.add(v);
    render(); return; }
  if(d.lfx){ S.lf.delete(d.lfx); render(); return; }
  if(d.lfclear!==undefined){ S.lf.clear(); S.lScope='全部'; render(); return; }
  // 任务岛：只有用户操作才展开；结果态点开 → 汇总；汇总收起 → 岛消失（已查看）
  if(d.island!==undefined){ e.stopPropagation();
    S.isl = {run:'open',open:'run',sync:'open',result:'summary',summary:'none',none:'open'}[S.isl];
    if(S.isl==='summary')S.iTab='汇总'; else if(S.isl==='open'&&S.iTab==='汇总')S.iTab='进度';
    render(); return; }
  if(d.itab){ S.iTab=d.itab; render(); return; }
  if(d.demoresult!==undefined){ S.isl= S.isl==='result'?'run':'result'; S.iTab='进度'; render(); return; }
  if(d.check!==undefined){ S.isl='sync'; S.syncFail=false; render(); setTimeout(()=>{ if(S.isl==='sync'){S.isl='run';render();} },2500); return; }
  if(d.toast!==undefined){ S.toast=false; S.isl='open'; S.iTab='历史'; render(); return; }
  if(d.dtab){ S.dTab=d.dtab; render(); return; }
  if(d.searchdep){ S.query=d.searchdep; S.screen='discover'; render(); $('#content').scrollTop=0; return; }
  if(d.settab){ S.setTab=d.settab; render(); return; }
  if(d.onboard!==undefined){ S.settings=false; S.onboard=1; render(); return; }
  if(d.onbnext!==undefined){ if(S.onboard>=3){S.onboard=0;} else S.onboard++; render(); return; }
  if(d.onbprev!==undefined){ S.onboard=Math.max(1,S.onboard-1); render(); return; }
  if(d.onbskip!==undefined){ S.onboard=0; render(); return; }
  if(d.onbscan!==undefined){ e.preventDefault(); S.onbScan=!S.onbScan; render(); return; }
  if(d.go){ S.screen=d.go; if(islOpen())S.isl=S.isl==='summary'?'none':'run'; S.fmenu=false;
    if(d.uscope)S.uScope=d.uscope; if(d.lfset){S.lf=new Set([d.lfset]);S.lScope='全部';}
    render(); $('#content').scrollTop=0; return; }
  if(d.pgo!==undefined){ S.palette=false; if(d.pgo==='detail'){S.prev='overview';S.screen='detail';} else if(d.pgo) S.screen=d.pgo; render(); return; }
  if(d.detail){ if(S.screen==='detail')return; S.prev=S.screen==='discover'?'library':S.screen; S.screen='detail'; S.dTab='概览'; render(); $('#content').scrollTop=0; return; }
  if(d.back!==undefined){ if(S.screen==='detail'){S.screen=S.prev;render();} return; }
  if(d.clear!==undefined){ S.sel.clear(); S.libSel.clear(); render(); return; }
  if(d.pal!==undefined){ S.palette=true; S.palIdx=0; render(); return; }
  if(d.sheet){ S.sheet=d.sheet; S.target=d.target||'visual-studio-code'; S.zap=false; S.zapText=''; render(); return; }
  if(d.settings!==undefined){ S.settings=true; render(); return; }
  if(d.close!==undefined){ S.sheet=''; render(); return; }
  if(d.zap!==undefined){ S.zap=!S.zap; S.zapText=''; render(); return; }
  if(d.theme){ S.theme=d.theme; render(); return; }
  if(d.reduce!==undefined){ S.reduce=!S.reduce; render(); return; }
  if(d.motion!==undefined){ S.motion=!S.motion; render(); return; }
  if(d.narrow!==undefined){ S.narrow=!S.narrow; render(); return; }
  if(d.accent){ S.accent=d.accent; render(); return; }
  if(d.scrim!==undefined && e.target===t){ S.palette=false; S.sheet=''; S.settings=false; render(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='zapInput'){ S.zapText=e.target.value; render(); }
  if(e.target.id==='palInput'){ S.query=e.target.value; S.palIdx=0; render(); }
  if(e.target.id==='search'){ const v=e.target.value, sg=$('#suggest'); S.query=v;
    sg.innerHTML = v?`<div data-go="discover">🔍 在 Homebrew 中搜索 “${v}”</div>${LIB.filter(r=>r[0].includes(v)).slice(0,4).map(r=>`<div data-detail="${r[0]}">${r[0]} <span class="t3">已安装 ${r[2]}</span></div>`).join('')}`:'';
    sg.classList.toggle('show',!!v); }
});
document.addEventListener('keydown',e=>{
  const m=e.metaKey||e.ctrlKey;
  if(m&&e.key==='k'){e.preventDefault();S.palette=!S.palette;S.palIdx=0;render();return;}
  if(m&&e.key===','){e.preventDefault();S.settings=true;render();return;}
  if(m&&e.key==='f'){e.preventDefault();$('#search').focus();return;}
  if(m&&e.altKey&&(e.key==='l'||e.key==='¬')){e.preventDefault();S.isl=islOpen()?'run':'open';render();return;}
  if(m&&e.key==='r'){e.preventDefault();S.isl='sync';render();setTimeout(()=>{if(S.isl==='sync'){S.isl='run';render();}},2500);return;}
  if(m&&/^[1-5]$/.test(e.key)){e.preventDefault();S.screen=NAV[+e.key-1][0];render();return;}
  if(m&&e.key==='['){e.preventDefault();if(S.screen==='detail'){S.screen=S.prev;render();}return;}
  if(S.palette&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();S.palIdx=Math.max(0,Math.min(13,S.palIdx+(e.key==='ArrowDown'?1:-1)));render();return;}
  if(S.palette&&e.key==='Enter'){const on=document.querySelector('.pitem.on');if(on)on.click();return;}
  if(e.key==='Enter'&&e.target.id==='search'&&S.query){S.screen='discover';$('#suggest').classList.remove('show');render();return;}
  if(e.key==='Escape'){
    if(S.onboard){S.onboard=0;}            // Esc 等同跳过引导，写入完成标记
    else if(S.fmenu){S.fmenu=false;}
    else if(S.palette||S.sheet||S.settings){S.palette=false;S.sheet='';S.settings=false;}
    else if(islOpen())S.isl=S.isl==='summary'?'none':'run';
    render(); }
});
addEventListener('resize',fit);
render();
</script>
</body>
</html>
